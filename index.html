
<!DOCTYPE html>
<html lang="it">

<head>

<style>

:root {

body {

/* TESTATA GIALLA */

.hero {

}

.brand {

}

.tortellino {

.eyebrow {
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #8c5529;
}

h1 {

  font-size: clamp(32px, 6vw, 48px);
  margin: 4px 0;
}

.hero p {
  color: #704825;
  margin-bottom: 0;
}

h2 {
  font-family: Georgia, serif;
  color: #754521;
}

button,
input,
textarea {
  font: inherit;
}

button {

}

/* NAVIGAZIONE */

.tabs {
  display: flex;
  gap: 8px;
  margin: 18px 0;
}

.tabs button,
.filter {
  padding: 10px 15px;
  background: #fffaf0;
  border: 1px solid #e6d5b9;
  color: #704826;
  border-radius: 12px;
  font-weight: 600;
}

.tabs .active,
.filter.active {
  background: #bd7046;
  color: white;
  border-color: #bd7046;
}

.filters {
  display: flex;
  overflow-x: auto;
  gap: 7px;
  padding-bottom: 12px;
}

.filter {
  flex-shrink: 0;
}

/* RIQUADRI */

.panel {
  background: #fffdf7;
  border: 1px solid #e8dbc4;
  border-radius: 16px;
  padding: 17px;
  margin: 12px 0;
}

.dish {
  border-bottom: 1px solid #f0e5d1;
  padding: 14px 0;
}

.dish:last-child {
  border: 0;
}

.dishhead {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.desc,
.muted {
  color: #8a7661;
  font-size: 13px;
}

.price {
  white-space: nowrap;
  font-weight: bold;
  color: #ad663c;
}

/* QUANTITÀ */

.controls {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 12px;
  margin-top: 8px;
}

.controls button {
  height: 34px;
  width: 34px;
  border: 1px solid #dfc9a6;
  border-radius: 9px;
  background: #fff6e4;
  color: #7d492d;
  font-size: 20px;
}

.option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 9px 0;
}

.option span {
  font-size: 13px;
}

/* CAMPI */

input,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #d9c7a9;
  border-radius: 10px;
  margin-top: 7px;
  background: #fffefa;
  color: #513a25;
}

label {

}

/* PULSANTI */

.primary {
  width: 100%;
  background: #a95632;
  color: white;
  border: 0;
  padding: 14px;
  border-radius: 12px;
  font-weight: bold;
  margin-top: 12px;
}

.primary:disabled {
  opacity: 0.6;
}

/* RIEPILOGO */

.row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 5px 0;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.stat {
  font-size: 30px;
  font-weight: bold;
  color: #a95632;
}

.hidden {
  display: none;
}

.person {
  border-bottom: 1px solid #eee0ca;
  padding: 12px 0;
}

.person button {
  margin-left: 8px;
  background: #f5e4c9;
  border: 1px solid #e4c8a4;
  border-radius: 7px;
  padding: 5px 8px;

}

.notice {
  font-size: 12px;
  color: #785325;
  background: #fff0ce;
  padding: 10px;
  border-radius: 9px;
}

footer {
  text-align: center;
  font-size: 12px;
  color: #8a7661;
  margin: 20px 0;
}

@media (max-width: 450px) {

    padding: 20px 15px;
  }

  .brand {
    gap: 10px;
  }

  .tortellino {

  }

  }
}

</style>
</head>

<body>

<main>

<!-- TESTATA -->

<!-- RIEPILOGO -->

</section>

<footer>
  Prezzi indicativi · Nessun totale da pagare calcolato
</footer>

</main>

<script type="module">

// FIREBASE

import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  doc,
  updateDoc,
  deleteDoc
} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

// NUOVO: AUTENTICAZIONE ANONIMA

import {
  getAuth,
  signInAnonymously
} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import { firebaseConfig } from "./config.js";

// MENU

const raw = [

  // PRIMI PIATTI

  [
    "Primi piatti",
    "Tortellini in brodo",
    12,
    "Anche alla panna o in crema di parmigiano",
    [

    ]
  ],

  [

    10,

  ],

  [
    "Primi piatti",
    "Balanzoni",

  ],

  [

  ],

  ],

  [

  ],

  [

  [

  ],

  [
    "Insalate",
    "La Leggera",
    9,
    "Insalata, finocchio, pomodoro, straccetti di pollo"
  ],

  // PIATTI FREDDI E SECONDI

  [
    "Piatti freddi e secondi",
    "Caprese",
    9,
    "Con mozzarella di bufala"
  ],

  [
    "Piatti freddi e secondi",
    "Bresaola",
    10,
    "Con pomodorini, scaglie di parmigiano e rucola"
  ],

  [
    "Piatti freddi e secondi",
    "Burratina con verdure",
    9,
    ""
  ],

  [
    "Piatti freddi e secondi",
    "Bufala e crudo",
    10,
    ""
  ],

  [
    "Piatti freddi e secondi",
    "Roast-beef",
    12,
    "Con pomodorini, scaglie di parmigiano e rucola"
  ],

  // DOLCI

  [
    "Dolci",
    "Torta di riso",
    4,
    ""
  ],

  [
    "Dolci",
    "Fior di latte",
    4,
    ""
  ],

  [
    "Dolci",
    "Panna cotta",
    4,
    ""
  ],

  [
    "Dolci",
    "Tenerina al cioccolato",
    4,
    ""
  ],

  [
    "Dolci",
    "Semifreddo agli amaretti",
    4,
    ""
  ],

  // FUORI MENU STAGIONALE

  [
    "Fuori menù stagionale",
    "Tortelloni di zucca e amaretti",
    12,
    "Scegli il condimento",
    [
      "Burro e salvia",
      "Ragù di salsiccia",
      "Ragù classico"
    ]
  ],

  [
    "Fuori menù stagionale",
    "Strozzapreti panna, speck e zucchine",
    11,
    ""
  ],

  [
    "Fuori menù stagionale",
    "Tagliatelle ai funghi porcini",
    12,
    ""
  ],

  [
    "Fuori menù stagionale",
    "Arrosto di tacchino",
    12,
    "Insalatina, finocchio, noci, salsa yogurt e patate"
  ],

  [
    "Fuori menù stagionale",
    "Straccetti di pollo con speck, zucchine e panna",
    13,
    "Con patate al forno"
  ],

  [
    "Fuori menù stagionale",
    "Cotoletta alla bolognese",
    13,
    ""
  ]

].map((a, id) => ({
  id,
  cat: a[0],
  name: a[1],
  price: a[2],
  desc: a[3],
  options: a[4] || [],
  free: a[5] || false
}));

// FUNZIONI DI BASE

const $ = id => document.getElementById(id);

const escape = s =>
  String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));

const cats = [...new Set(raw.map(d => d.cat))];

let filter = "Tutti";
let cart = {};
let orders = [];
let editing = null;
let db = null;
let coll = null;
let online = false;

const key = (id, opt = "") => id + "|" + opt;

// CONTROLLI QUANTITÀ

function step(k) {
  return `
    <div class="controls">
      <button data-key="${escape(k)}" data-step="-1">−</button>
      <b>${cart[k] || 0}</b>
      <button data-key="${escape(k)}" data-step="1">+</button>
    </div>
  `;
}

// DISEGNA MENU

function drawMenu() {

  $("filters").innerHTML =
    ["Tutti", ...cats].map(c => `
      <button
        class="filter ${filter === c ? "active" : ""}"
        data-filter="${escape(c)}"
      >
        ${escape(c)}
      </button>
    `).join("");

  $("menu").innerHTML = cats
    .filter(c => filter === "Tutti" || filter === c)
    .map(c => `

      <div class="panel">

        <h2>${escape(c)}</h2>

        ${raw.filter(d => d.cat === c).map(d => `

          <div class="dish">

            <div class="dishhead">

              <div>
                <strong>${escape(d.name)}</strong>
                <div class="desc">${escape(d.desc)}</div>
              </div>

              <span class="price">${d.price} €</span>

            </div>

            ${
              d.options.length

                ? d.options.map(o => `
                  <div class="option">
                    <span>${escape(o)}</span>
                    ${step(key(d.id, o))}
                  </div>
                `).join("")

                : d.free

                  ? `
                    <label class="muted">
                      Condimento
                      <input
                        data-free="${d.id}"
                        placeholder="Es. pomodoro"
                        value="${escape(
                          Object.keys(cart)
                            .find(k =>
                              k.startsWith(d.id + "|") &&
                              cart[k] > 0
                            )
                            ?.split("|")
                            .slice(1)
                            .join("|") || ""
                        )}"
                      >
                    </label>

                    ${step(key(d.id, "__free__"))}
                  `

                  : step(key(d.id))
            }

          </div>

        `).join("")}

      </div>

    `).join("");

  $("chosen").textContent =
    "Piatti selezionati: " +
    Object.values(cart).reduce((a, b) => a + b, 0);
}

// FILTRI

$("filters").onclick = e => {

  const b = e.target.closest("[data-filter]");

  if (b) {
    filter = b.dataset.filter;
    drawMenu();
  }

};

// AGGIUNGI / RIMUOVI

$("menu").onclick = e => {

  const b = e.target.closest("[data-key]");

  if (!b) return;

  let k = b.dataset.key;
  let delta = +b.dataset.step;
  let [id, opt] = k.split("|");

  if (opt === "__free__") {

    const input = document.querySelector(
      `[data-free="${id}"]`
    );

    const name = input.value.trim();

    if (delta > 0 && !name) {
      input.focus();
      $("error").textContent =
        "Specifica il condimento degli gnocchi.";
      return;
    }

    let old = Object.keys(cart).filter(
      x => x.startsWith(id + "|")
    );

    let count = old.reduce(
      (s, x) => s + cart[x],
      0
    );

    old.forEach(x => delete cart[x]);

    if (count + delta > 0) {
      cart[key(id, name)] = count + delta;
    }

  } else {

    cart[k] = Math.max(
      0,
      (cart[k] || 0) + delta
    );

  }

  drawMenu();

};

// CONDIMENTO GNOCCHI

$("menu").onchange = e => {

  let inp = e.target.closest("[data-free]");

  if (!inp) return;

  let id = inp.dataset.free;

  let keys = Object.keys(cart).filter(
    k => k.startsWith(id + "|")
  );

  let n = keys.reduce(
    (s, k) => s + cart[k],
    0
  );

  keys.forEach(k => delete cart[k]);

  if (n && inp.value.trim()) {
    cart[key(id, inp.value.trim())] = n;
  }

  drawMenu();

};

// CAMBIO SCHERMATA

function tab(t) {

  $("menuPage").classList.toggle(
    "hidden",
    t !== "menu"
  );

  $("recapPage").classList.toggle(
    "hidden",
    t !== "recap"
  );

  $("menuTab").classList.toggle(
    "active",
    t === "menu"
  );

  $("recapTab").classList.toggle(
    "active",
    t === "recap"
  );

  if (t === "recap") {
    drawRecap();
  }

}

$("menuTab").onclick = () => tab("menu");
$("recapTab").onclick = () => tab("recap");

// ETICHETTA PIATTO

function label(k) {

  let [id, ...rest] = k.split("|");

  return raw[+id].name +
    (rest.join("|")
      ? " — " + rest.join("|")
      : "");

}

// SALVA ORDINE

$("save").onclick = async () => {

  if (!online) {
    $("error").textContent =
      "Attendi la connessione sicura a Firebase.";
    return;
  }

  let name = $("name").value.trim();

  let items = Object.fromEntries(
    Object.entries(cart).filter(
      ([k, v]) => v > 0
    )
  );

  if (!name || !Object.keys(items).length) {

    $("error").textContent =
      "Inserisci il nome e scegli almeno un piatto.";

    return;
  }

  let record = {
    name,
    items,
    notes: $("notes").value.trim()
  };

  $("save").disabled = true;

  try {

    if (editing) {

      await updateDoc(
        doc(db, "ordini", editing),
        record
      );

    } else {

      await addDoc(coll, record);

    }

    cart = {};
    editing = null;

    $("name").value = "";
    $("notes").value = "";
    $("error").textContent = "";

    $("save").textContent = "Conferma ordine";

    drawMenu();
    tab("recap");

  } catch (e) {

    $("error").textContent =
      "Errore salvataggio: " + e.message;

  } finally {

    $("save").disabled = !online;

  }

};

// AGGREGA QUANTITÀ

function aggregate() {

  let t = {};

  orders.forEach(o => {

    Object.entries(o.items).forEach(
      ([k, v]) => {
        t[k] = (t[k] || 0) + v;
      }
    );

  });

  return t;

}

// DISEGNA RIEPILOGO

function drawRecap() {

  let t = aggregate();

  $("n").textContent = orders.length;

  $("people").textContent = orders.length;

  $("plates").textContent =
    Object.values(t).reduce((a, b) => a + b, 0);

  $("totals").innerHTML =
    Object.keys(t).length

      ? Object.keys(t)
          .sort(
            (a, b) =>
              +a.split("|")[0] -
              +b.split("|")[0]
          )
          .map(k => `
            <div class="row">
              <span>${escape(label(k))}</span>
              <strong>${t[k]} ×</strong>
            </div>
          `).join("")

      : "Nessun ordine";

  $("persons").innerHTML =
    orders.length

      ? orders.map(o => `

        <div class="person">

          <strong>${escape(o.name)}</strong>

          <button data-edit="${escape(o.id)}">
            Modifica
          </button>

          <button data-delete="${escape(o.id)}">
            Elimina
          </button>

          ${Object.entries(o.items)
            .map(([k, q]) => `
              <div class="muted">
                ${q} × ${escape(label(k))}
              </div>
            `).join("")}

          ${
            o.notes
              ? `<div class="muted">
                   Note: ${escape(o.notes)}
                 </div>`
              : ""
          }

        </div>

      `).join("")

      : "Nessun partecipante";

}

// MODIFICA O ELIMINA

$("persons").onclick = async e => {

  let b = e.target.closest("button");

  if (!b) return;

  let id = b.dataset.edit ?? b.dataset.delete;

  let o = orders.find(x => x.id === id);

  if (!o) return;

  if (b.dataset.delete !== undefined) {

    if (!confirm(
      "Eliminare l'ordine di " + o.name + "?"
    )) {
      return;
    }

    try {

      if (online) {

        await deleteDoc(
          doc(db, "ordini", id)
        );

      }

      drawRecap();

    } catch (e) {

      alert(e.message);

    }

  } else {

    editing = id;

    cart = { ...o.items };

    $("name").value = o.name;
    $("notes").value = o.notes;

    $("save").textContent = "Salva modifiche";

    filter = "Tutti";

    drawMenu();
    tab("menu");

  }

};

// TESTO RIEPILOGO

function report() {

  let t = aggregate();

  return (
    "BALANZONE 157 — " +
    orders.length +
    " persone\n\n" +

    "TOTALI\n" +

    Object.keys(t).map(
      k => t[k] + " × " + label(k)
    ).join("\n") +

    "\n\nPERSONE\n" +

    orders.map(o =>

      o.name + "\n" +

      Object.entries(o.items).map(
        ([k, q]) =>
          q + " × " + label(k)
      ).join("\n") +

      (o.notes
        ? "\nNote: " + o.notes
        : "")

    ).join("\n\n")
  );

}

// COPIA RIEPILOGO

$("copy").onclick = async () => {

  try {

    await navigator.clipboard.writeText(
      report()
    );

    $("copy").textContent = "Copiato ✓";

    setTimeout(() => {
      $("copy").textContent = "Copia riepilogo";
    }, 1800);

  } catch (e) {

    alert(
      "Copia non disponibile su questo browser"
    );

  }

};

// ESPORTA CSV

$("csv").onclick = () => {

  let rows = [[
    "Nome",
    "Categoria",
    "Piatto",
    "Condimento",
    "Quantità",
    "Note"
  ]];

  orders.forEach(o => {

    Object.entries(o.items).forEach(
      ([k, q]) => {

        let [id, ...opt] = k.split("|");

        let d = raw[+id];

        rows.push([
          o.name,
          d.cat,
          d.name,
          opt.join("|"),
          q,
          o.notes
        ]);

      }
    );

  });

  let csv = "\ufeff" + rows.map(
    r => r.map(
      x => '"' +
        String(x).replace(/"/g, '""') +
        '"'
    ).join(";")
  ).join("\r\n");

  let a = document.createElement("a");

  a.href = URL.createObjectURL(
    new Blob(
      [csv],
      { type: "text/csv;charset=utf-8" }
    )
  );

  a.download = "ordini-pranzo.csv";

  a.click();

  setTimeout(() => {
    URL.revokeObjectURL(a.href);
  }, 1000);

};

// AVVIO

drawMenu();
drawRecap();

// COLLEGAMENTO FIREBASE CON AUTENTICAZIONE

try {

  if (
    !firebaseConfig.apiKey ||
    firebaseConfig.apiKey.includes("INSERISCI")
  ) {

    throw Error(
      "Configurazione Firebase non inserita"
    );

  }

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  // Ogni dispositivo accede automaticamente
  // senza email o password.

  await signInAnonymously(auth);

  db = getFirestore(app);

  coll = collection(db, "ordini");

  onSnapshot(

    coll,

    snap => {

      orders = snap.docs.map(d => ({
        id: d.id,
        ...d.data()
      }));

      online = true;

      $("status").textContent =
        "🟢 Ordini condivisi online";

      $("status").style.background = "#e3f4e7";

      $("save").disabled = false;

      if (!editing) {
        $("save").textContent = "Conferma ordine";
      }

      drawRecap();

    },

    err => {

      online = false;

      $("save").disabled = true;

      $("status").textContent =
        "Errore database: " + err.message;

      $("status").style.background = "#ffe1d6";

    }

  );

} catch (e) {

  online = false;

  $("save").disabled = true;

  $("status").textContent =
    "⚠️ Errore autenticazione: " + e.message;

  $("status").style.background = "#ffe1d6";

}

</script>
